[layout]
grid = 40

[poly.DPAD_UP]
label = DPAD_UP
bind  = BTN_DPAD_UP
mode  = digital
verts = 9,24;11,24;11,27;9,27

[poly.DPAD_DOWN]
label = DPAD_DOWN
bind  = BTN_DPAD_DOWN
mode  = digital
verts = 9,29;11,29;11,32;9,32

[poly.DPAD_LEFT]
label = DPAD_LEFT
bind  = BTN_DPAD_LEFT
mode  = digital
verts = 6,27;9,27;9,29;6,29

[poly.DPAD_RIGHT]
label = DPAD_RIGHT
bind  = BTN_DPAD_RIGHT
mode  = digital
verts = 11,27;14,27;14,29;11,29

[circle.START]
cx     = 3
cy     = 29
radius = 1
label  = START
bind   = BTN_START
mode   = digital

[circle.BACK]
cx     = 1
cy     = 27
radius = 1
label  = BACK
bind   = BTN_BACK
mode   = digital

[circle.L3]
cx     = 7
cy     = 17
radius = 5
label  = L3
bind   = BTN_L3
mode   = digital

[circle.R3]
cx     = 22
cy     = 28
radius = 5
label  = R3
bind   = BTN_R3
mode   = digital

# Face buttons are analog (0-255 pressure) on the original Xbox. They show as
# analog here; the digital press is derived in the config via a threshold.
[circle.A]
cx     = 30
cy     = 21
radius = 3
label  = A
bind   = BTN_A
mode   = analog

[circle.B]
cx     = 30
cy     = 13
radius = 3
label  = B
bind   = BTN_B
mode   = analog

[circle.X]
cx     = 25
cy     = 17
radius = 3
label  = X
bind   = BTN_X
mode   = analog

[circle.Y]
cx     = 35
cy     = 17
radius = 3
label  = Y
bind   = BTN_Y
mode   = analog

[circle.BLACK]
cx     = 37
cy     = 25
radius = 3
label  = BLACK
bind   = BTN_BLACK
mode   = analog

[circle.WHITE]
cx     = 32
cy     = 30
radius = 3
label  = WHITE
bind   = BTN_WHITE
mode   = analog

[poly.L_TRIGGER]
label = L_TRIGGER
bind  = LEFT_TRIGGER
mode  = analog
verts = 2,4;5,4;5,9;2,9

[poly.R_TRIGGER]
label = R_TRIGGER
bind  = RIGHT_TRIGGER
mode  = analog
verts = 34,4;37,4;37,9;34,9

[stick.L]
cx     = 7
cy     = 17
radius = 4
label  = L
bind_x = LEFT_STICK_X
bind_y = LEFT_STICK_Y
deadzone = 0.080

[stick.R]
cx     = 22
cy     = 28
radius = 4
label  = R
bind_x = RIGHT_STICK_X
bind_y = RIGHT_STICK_Y
deadzone = 0.080
