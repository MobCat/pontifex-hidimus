[layout]
grid = 40

[circle.CROSS]
cx     = 34
cy     = 20
radius = 1
label  = CROSS
bind   = BTN_CROSS
mode   = digital

[circle.CIRCL]
cx     = 36
cy     = 18
radius = 1
label  = CIRCL
bind   = BTN_CIRCLE
mode   = digital

[circle.SQUAR]
cx     = 32
cy     = 18
radius = 1
label  = SQUAR
bind   = BTN_SQUARE
mode   = digital

[circle.TRIAN]
cx     = 34
cy     = 16
radius = 1
label  = TRIAN
bind   = BTN_TRIANGLE
mode   = digital

[poly.L1]
label = L1
bind  = BTN_L1
mode  = digital
verts = 4,10;8,10;8,12;4,12

[poly.R1]
label = R1
bind  = BTN_R1
mode  = digital
verts = 33,10;37,10;37,12;33,12

[poly.L2]
label = L2
bind  = BTN_L2
mode  = digital
verts = 4,4;5,4;5,9;4,9

[poly.R2]
label = R2
bind  = BTN_R2
mode  = none
verts = 33,4;34,4;34,9;33,9

[poly.SHARE]
label = SHARE
bind  = BTN_CREATE
mode  = digital
verts = 10,13;11,13;12,15;11,15

[poly.OPTION]
label = OPTION
bind  = BTN_OPTIONS
mode  = digital
verts = 31,13;32,13;31,15;30,15

[circle.L3]
cx     = 9
cy     = 30
radius = 5
label  = L3
bind   = BTN_L3
mode   = digital

[circle.R3]
cx     = 31
cy     = 30
radius = 5
label  = R3
bind   = BTN_R3
mode   = digital

[circle.PS]
cx     = 21
cy     = 31
radius = 1
label  = PS
bind   = BTN_PS
mode   = digital

[poly.TOUCH]
label = TOUCH
bind  = BTN_TOUCHPAD
mode  = digital
verts = 13,14;29,14;29,22;13,22

[poly.MUTE]
label = MUTE
bind  = BTN_MUTE
mode  = digital
verts = 20,33;22,33;22,34;20,34

[poly.DPAD_UP]
label = DPAD_UP
bind  = BTN_DPAD_UP
mode  = digital
verts = 5,13;7,13;7,16;6,17;5,16

[poly.DPAD_DOWN]
label = DPAD_DOWN
bind  = BTN_DPAD_DOWN
mode  = digital
verts = 5,19;6,18;7,19;7,22;5,22

[poly.DPAD_LEFT]
label = DPAD_LEFT
bind  = BTN_DPAD_LEFT
mode  = digital
verts = 1,17;4,17;5,18;4,19;1,19

[poly.DPAD_RIGHT]
label = DPAD_RIGHT
bind  = BTN_DPAD_RIGHT
mode  = digital
verts = 8,17;11,17;11,19;8,19;7,18

[poly.L2_AN]
label = L2_AN
bind  = L2_ANALOG
mode  = analog
verts = 5,4;8,4;8,9;5,9

[poly.R2_AN]
label = R2_AN
bind  = R2_ANALOG
mode  = analog
verts = 34,4;37,4;37,9;34,9

[stick.L]
cx     = 9
cy     = 30
radius = 4
label  = L
bind_x = LEFT_STICK_X
bind_y = LEFT_STICK_Y

[stick.R]
cx     = 31
cy     = 30
radius = 4
label  = R
bind_x = RIGHT_STICK_X
bind_y = RIGHT_STICK_Y

[poly.BATTERY]
label = BATTERY
bind  = BATTERY_LEVEL
mode  = analog
verts = 20,1;22,1;22,4;20,4

[touch.TOUCHPAD]
label = TOUCHPAD
bind_x  = TOUCH1_X
bind_y  = TOUCH1_Y
bind2_x = TOUCH2_X
bind2_y = TOUCH2_Y
verts = 14,15;28,15;28,21;14,21

