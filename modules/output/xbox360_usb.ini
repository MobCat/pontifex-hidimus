[layout]
grid = 40

[poly.DPAD_UP]
label = DPAD_UP
bind  = XINPUT_GAMEPAD_DPAD_UP
mode  = digital
verts = 13,25;15,25;15,28;13,28

[poly.DPAD_DOWN]
label = DPAD_DOWN
bind  = XINPUT_GAMEPAD_DPAD_DOWN
mode  = digital
verts = 13,30;14,30;15,30;15,33;13,33

[poly.DPAD_LEFT]
label = DPAD_LEFT
bind  = XINPUT_GAMEPAD_DPAD_LEFT
mode  = digital
verts = 10,28;13,28;13,30;10,30

[poly.DPAD_RIGHT]
label = DPAD_RIGHT
bind  = XINPUT_GAMEPAD_DPAD_RIGHT
mode  = digital
verts = 15,28;18,28;18,30;15,30

[poly.START]
label = START
bind  = XINPUT_GAMEPAD_START
mode  = digital
verts = 24,19;26,19;27,20;26,21;24,21

[poly.BACK]
label = BACK
bind  = XINPUT_GAMEPAD_BACK
mode  = digital
verts = 16,19;18,19;18,21;16,21;15,20

[circle.XINPU]
cx     = 8
cy     = 20
radius = 5
label  = XINPU
bind   = XINPUT_GAMEPAD_LEFT_THUMB
mode   = digital

[circle.XINPU]
cx     = 29
cy     = 29
radius = 5
label  = XINPU
bind   = XINPUT_GAMEPAD_RIGHT_THUMB
mode   = digital

[poly.LB]
label = LB
bind  = XINPUT_GAMEPAD_LEFT_SHOULDER
mode  = digital
verts = 5,11;9,11;9,13;5,13

[poly.RB]
label = RB
bind  = XINPUT_GAMEPAD_RIGHT_SHOULDER
mode  = digital
verts = 30,11;34,11;34,13;30,13

[circle.GUIDE]
cx     = 21
cy     = 20
radius = 2
label  = GUIDE
bind   = XINPUT_GAMEPAD_GUIDE
mode   = digital

[circle.A]
cx     = 32
cy     = 22
radius = 1
label  = A
bind   = XINPUT_GAMEPAD_A
mode   = digital

[circle.B]
cx     = 34
cy     = 20
radius = 1
label  = B
bind   = XINPUT_GAMEPAD_B
mode   = digital

[circle.X]
cx     = 30
cy     = 20
radius = 1
label  = X
bind   = XINPUT_GAMEPAD_X
mode   = digital

[circle.Y]
cx     = 32
cy     = 18
radius = 1
label  = Y
bind   = XINPUT_GAMEPAD_Y
mode   = digital

[poly.LT]
label = LT
bind  = LEFT_TRIGGER
mode  = analog
verts = 6,5;9,5;9,10;6,10

[poly.RT]
label = RT
bind  = RIGHT_TRIGGER
mode  = analog
verts = 30,5;33,5;33,10;30,10

[stick.L]
cx     = 8
cy     = 20
radius = 4
label  = L
bind_x = LEFT_STICK_X
bind_y = LEFT_STICK_Y
deadzone = 0.080

[stick.R]
cx     = 29
cy     = 29
radius = 4
label  = R
bind_x = RIGHT_STICK_X
bind_y = RIGHT_STICK_Y
deadzone = 0.080

