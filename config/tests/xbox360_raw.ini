# Phidimus Xbox 360 raw-gadget ENUMERATION test — presents the virtual xbox360_usb
# pad over /dev/raw-gadget but drives NO inputs (idle). Use this to check that the
# device enumerates cleanly on the host (shows up in Device Manager / joy.cpl with
# VID 045E / PID 028E, and USBView can read its full descriptors incl. the 17-byte
# 0x21 vendor block) WITHOUT the self-test pattern flooding input reports.
#
# The macro is declared only because the engine requires an input or a macro; it is
# NOT invoked (no [defaults], no bindings), so the pad reports a neutral idle state.
# Once this enumerates cleanly AND survives a config stop → other config → back,
# run xbox360_selftest_raw to add the moving test pattern and verify input.
#
# Pi only — raw_gadget needs a UDC; off-hardware it falls back to USB/IP.
#
#   phidimus-pi config/tests/xbox360_raw.ini

[config]
id       = xbox360_raw
author   = MobCat
phidimus = 4.1.0
macro    = x360testpatten   ; loaded only to satisfy "needs an input or macro"; not invoked → idle
output   = xbox360_usb
method   = raw_gadget        ; present on the board's USB port (carries vendor descriptors)
# usbip  = 127.0.0.1:3240    ; optional USB/IP host:port when off-hardware

# Feedback readout — the host (xusb) sends rumble + LED-ring commands IN on EP 0x01,
# decoded by xbox360_usb's on_output(). There's no physical input to route them to,
# so these identity maps just surface the decoded values as OLED feedback bars: a
# live confirmation that the host is actually sending output to the virtual pad.
[xbox360_usb.feedback]
RUMBLE_LARGE = RUMBLE_LARGE   ; left / low-frequency motor  (0..255)
RUMBLE_SMALL = RUMBLE_SMALL   ; right / high-frequency motor (0..255)
LED_PATTERN  = LED_PATTERN    ; LED-ring animation id the game requests (0..13)
