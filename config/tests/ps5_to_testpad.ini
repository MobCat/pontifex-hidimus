# Pontifex Hidimus - Profile: PS5 DualSense -> Phidimus Test Gamepad (USB/IP)
#
# Engine 4.0 end-to-end test: drives the QC usb_device test pad with a real
# DualSense. Confirms the QC -> usbdev -> USB/IP bridge works with live input.
#
# Run:    phidimus-sdk --config config/ps5_to_testpad.ini
# Attach: usbip attach -r 127.0.0.1 -b 1-1   (after the above is running)
# Then:   the OS sees "Phidimus Test Gamepad" and its buttons/sticks respond.

[config]
id       = ps5_to_testpad
author   = MobCat
phidimus = 4.0.0
input    = ps5ds
output   = testpad_usb

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Map the four face buttons to the test pad's first four buttons,
# and the left stick to X/Y.
[testpad_usb.buttons]
BTN_CROSS    = BTN_1
BTN_CIRCLE   = BTN_2
BTN_SQUARE   = BTN_3
BTN_TRIANGLE = BTN_4
BTN_L1       = BTN_5
BTN_R1       = BTN_6
BTN_L3       = BTN_7
BTN_R3       = BTN_8

[testpad_usb.axes]
LEFT_STICK_X = X
LEFT_STICK_Y = Y
