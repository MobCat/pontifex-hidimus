# Phidimus self-test — drives the virtual test gamepad from macros, with no
# physical controller. The testpattern macro synthesises moving sticks/triggers,
# a 16-button cycle, and an 8-way hat walk; testpad_usb presents it as a real USB
# device (over USB/IP on a PC, or the board's own port on phidimus-pi). Watch it
# in joy.cpl (Windows) or any gamepad tester — every control should move.
#
# To change the test, edit macros/testpattern.qc or swap the macro — no recompile.
# This single profile is portable across both output transports (see method=):
# on phidimus-pi it presents on the board's own USB port; on the desktop SDK it
# falls back to USB/IP (replacing the old hard-coded usbiptest/gadgettest binaries).
#
#   phidimus-sdk --config config\testpad_selftest.ini   ; desktop → USB/IP (joy.cpl)
#   phidimus-pi  config/testpad_selftest.ini            ; Pi → real USB port

[config]
id       = testpad_selftest
author   = MobCat
phidimus = 4.1.0
macro    = testpattern
#input   = ; Not needed for a self test like this — the macro IS the input.
output   = testpad_usb
method   = usb_gadget      ; Pi: present on the board's USB port; elsewhere → USB/IP
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port (default shown)

# Run both test functions from load. They drive disjoint signals (sweep =
# sticks/triggers/buttons, dpad = hat), so together they exercise the whole pad.
# Drop one to focus the test. A macro started here runs every tick until exit.
[defaults]
macro = testpattern.sweep(), testpattern.dpad()

[testpad_usb.axes]
STICK_X  = X
STICK_Y  = Y
STICK_RX = RX
STICK_RY = RY
TRIGGER_L = Z
TRIGGER_R = RZ

[testpad_usb.buttons]
BTN_1  = BTN_1
BTN_2  = BTN_2
BTN_3  = BTN_3
BTN_4  = BTN_4
BTN_5  = BTN_5
BTN_6  = BTN_6
BTN_7  = BTN_7
BTN_8  = BTN_8
BTN_9  = BTN_9
BTN_10 = BTN_10
BTN_11 = BTN_11
BTN_12 = BTN_12
BTN_13 = BTN_13
BTN_14 = BTN_14
BTN_15 = BTN_15
BTN_16 = BTN_16
HAT_UP    = HAT_UP
HAT_DOWN  = HAT_DOWN
HAT_LEFT  = HAT_LEFT
HAT_RIGHT = HAT_RIGHT
