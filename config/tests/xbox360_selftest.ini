# Phidimus Xbox 360 self-test — drives the virtual xbox360_usb pad from the
# x360testpatten macro, with no physical controller. Proves a REAL controller
# identity (VID 045E / PID 028E, xusb22.sys / xpad binds it) enumerates and that
# every XInput control moves. Watch it in joy.cpl, the Windows "Game Controllers"
# tester, or any XInput viewer — buttons cycle, D-pad walks, both sticks move
# (left = diagonals, right = circle), triggers ramp.
#
# Portable across transports: on phidimus-pi it presents on the board's own USB
# port (method=usb_gadget); on the desktop SDK it falls back to USB/IP.
#
#   phidimus-sdk --config config\xbox360_selftest.ini
#   phidimus-pi  config/xbox360_selftest.ini

[config]
id       = xbox360_selftest
author   = MobCat
phidimus = 4.1.0
macro    = x360testpatten
#input   = ; Not needed for a self test — the macro IS the input.
output   = xbox360_usb
method   = usb_gadget      ; Pi: present on the board's USB port; elsewhere → USB/IP
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port (default shown)

# Run every test function from load. They drive disjoint signals, so together they
# exercise the whole pad. Drop one to focus the test.
[defaults]
macro = x360testpatten.buttons(), x360testpatten.dpad(), x360testpatten.lstick(), x360testpatten.rstick(), x360testpatten.triggers()

[xbox360_usb.buttons]
BTN_A      = XINPUT_GAMEPAD_A
BTN_B      = XINPUT_GAMEPAD_B
BTN_X      = XINPUT_GAMEPAD_X
BTN_Y      = XINPUT_GAMEPAD_Y
BTN_LB     = XINPUT_GAMEPAD_LEFT_SHOULDER
BTN_RB     = XINPUT_GAMEPAD_RIGHT_SHOULDER
BTN_LS     = XINPUT_GAMEPAD_LEFT_THUMB
BTN_RS     = XINPUT_GAMEPAD_RIGHT_THUMB
BTN_START  = XINPUT_GAMEPAD_START
BTN_BACK   = XINPUT_GAMEPAD_BACK
BTN_GUIDE  = XINPUT_GAMEPAD_GUIDE
DPAD_UP    = XINPUT_GAMEPAD_DPAD_UP
DPAD_DOWN  = XINPUT_GAMEPAD_DPAD_DOWN
DPAD_LEFT  = XINPUT_GAMEPAD_DPAD_LEFT
DPAD_RIGHT = XINPUT_GAMEPAD_DPAD_RIGHT

[xbox360_usb.axes]
LX = LEFT_STICK_X
LY = LEFT_STICK_Y
RX = RIGHT_STICK_X
RY = RIGHT_STICK_Y
LT = LEFT_TRIGGER
RT = RIGHT_TRIGGER
