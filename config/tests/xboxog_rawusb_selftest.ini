# Phidimus original-Xbox self-test — RAW-GADGET. Drives the virtual xboxog_rawusb
# XID pad from the x360testpatten macro (no physical controller), so a REAL
# original Xbox console can verify every control end-to-end.
#
# The XID descriptor + capability reports the console fetches on EP0 are answered
# by xboxog_rawusb.qc's on_control(); raw-gadget delivers them verbatim (like the
# 360's 0x21 descriptor). The OG Xbox does no controller auth, so a faithful XID
# device is accepted directly — no hub needed.
#
# Pi only — raw_gadget needs a UDC; off-hardware it falls back to USB/IP (where
# Windows has no XID driver, so it enumerates but won't bind a game — the real
# test is on the console).
#
# ⚠ REAL-CONSOLE WARNING: this full sweep cycles Back while the triggers ramp,
# and LT+RT+Back is a reboot combo on the original Xbox — it will reset the
# console mid-test. Use it on the bench (USB/IP) or when you only need to confirm
# every control moves. For an on-console soak test that never touches a digital
# button, use xboxog_rawusb_analogtest.ini instead.
#
#   phidimus-pi config/tests/xboxog_rawusb_selftest.ini

[config]
id       = xboxog_rawusb_selftest
author   = MobCat
phidimus = 4.3.0
macro    = x360testpatten
#input   = ; Not needed for a self test — the macro IS the input.
output   = xboxog_rawusb
method   = raw_gadget       ; Pi: present on the board's USB port (carries the XID vendor requests)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port (default shown) when off-hardware

# Run every test function from load. They drive disjoint signals, so together they
# exercise the whole pad. Drop one to focus the test.
[defaults]
macro = x360testpatten.buttons(), x360testpatten.dpad(), x360testpatten.lstick(), x360testpatten.rstick(), x360testpatten.triggers()

# Digital buttons (report byte 2): d-pad, Start/Back, stick clicks.
# Mapping direction is  input_signal = output_signal  (macro signal on the left).
[xboxog_rawusb.buttons]
DPAD_UP    = BTN_DPAD_UP
DPAD_DOWN  = BTN_DPAD_DOWN
DPAD_LEFT  = BTN_DPAD_LEFT
DPAD_RIGHT = BTN_DPAD_RIGHT
BTN_START  = BTN_START
BTN_BACK   = BTN_BACK
BTN_LS     = BTN_L3
BTN_RS     = BTN_R3

# Analog controls. The face buttons are ANALOG (pressure) on the OG Xbox; the
# macro's digital buttons cross-map to them (button→axis scales 0..1 → 0..255,
# so each press is a full 255 pulse). Sticks/triggers pass straight through.
# Y is NOT inverted here — the module's pack() already negates Y (XInput-up →
# OG-hardware-wire-up), so the macro's convention lands correct on the console.
[xboxog_rawusb.axes]
BTN_A = BTN_A
BTN_B = BTN_B
BTN_X = BTN_X
BTN_Y = BTN_Y
BTN_LB = BTN_BLACK
BTN_RB = BTN_WHITE
LT = LEFT_TRIGGER
RT = RIGHT_TRIGGER
LX = LEFT_STICK_X
LY = LEFT_STICK_Y
RX = RIGHT_STICK_X
RY = RIGHT_STICK_Y

# Feedback readout — surface the console's decoded rumble as OLED bars. No
# physical input to route to, so these are identity maps purely for a live
# "the console is sending rumble" readout.
[xboxog_rawusb.feedback]
RUMBLE_LEFT  = RUMBLE_LEFT     ; left / low-frequency motor  (0..255)
RUMBLE_RIGHT = RUMBLE_RIGHT    ; right / high-frequency motor (0..255)
