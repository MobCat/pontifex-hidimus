# Phidimus Xbox 360 self-test — RAW-GADGET variant. Same macro-driven virtual
# xbox360_usb pad as xbox360_selftest.ini, but presented over /dev/raw-gadget
# instead of FunctionFS. FunctionFS validates the 360's 17-byte type-0x21 vendor
# descriptor as a 9-byte HID descriptor and DROPS it, so XInput sees no input;
# raw-gadget delivers every descriptor byte verbatim, so the 0x21 descriptor
# reaches the host and xusb22.sys binds with full XInput input.
#
# A/B test: run xbox360_selftest.ini (usb_gadget) and watch USBView — the config
# descriptor is missing the 0x21 block and joy.cpl shows no movement. Run THIS
# one (raw_gadget) and the 0x21 descriptor is present and the controls sweep.
#
# Pi only — raw_gadget needs a UDC; off-hardware it falls back to USB/IP.
#
#   phidimus-pi config/tests/xbox360_selftest_raw.ini

[config]
id       = xbox360_selftest_raw
author   = MobCat
phidimus = 4.1.0
macro    = x360testpatten
#input   = ; Not needed for a self test — the macro IS the input.
output   = xbox360_usb
method   = raw_gadget       ; Pi: present on the board's USB port (carries vendor descriptors)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port (default shown) when off-hardware

# Run every test function from load. They drive disjoint signals, so together they
# exercise the whole pad. Drop one to focus the test.
[defaults]
macro = x360testpatten.buttons(), x360testpatten.dpad(), x360testpatten.lstick(), x360testpatten.rstick(), x360testpatten.triggers()

[xbox360_usb.buttons]
BTN_A      = XINPUT_GAMEPAD_A
BTN_B      = XINPUT_GAMEPAD_B
BTN_X      = XINPUT_GAMEPAD_X
BTN_Y      = XINPUT_GAMEPAD_Y
BTN_LB     = XINPUT_GAMEPAD_LEFT_SHOULDER
BTN_RB     = XINPUT_GAMEPAD_RIGHT_SHOULDER
BTN_LS     = XINPUT_GAMEPAD_LEFT_THUMB
BTN_RS     = XINPUT_GAMEPAD_RIGHT_THUMB
BTN_START  = XINPUT_GAMEPAD_START
BTN_BACK   = XINPUT_GAMEPAD_BACK
BTN_GUIDE  = XINPUT_GAMEPAD_GUIDE
DPAD_UP    = XINPUT_GAMEPAD_DPAD_UP
DPAD_DOWN  = XINPUT_GAMEPAD_DPAD_DOWN
DPAD_LEFT  = XINPUT_GAMEPAD_DPAD_LEFT
DPAD_RIGHT = XINPUT_GAMEPAD_DPAD_RIGHT

[xbox360_usb.axes]
LX = LEFT_STICK_X
LY = LEFT_STICK_Y
RX = RIGHT_STICK_X
RY = RIGHT_STICK_Y
LT = LEFT_TRIGGER
RT = RIGHT_TRIGGER

# Feedback readout — surface the host's decoded rumble + LED-ring reports (from
# xusb's on_output) as OLED feedback bars. No physical input to route to, so these
# are identity maps purely for a live "the host is sending output" readout.
[xbox360_usb.feedback]
RUMBLE_LARGE = RUMBLE_LARGE   ; left / low-frequency motor  (0..255)
RUMBLE_SMALL = RUMBLE_SMALL   ; right / high-frequency motor (0..255)
LED_PATTERN  = LED_PATTERN    ; LED-ring animation id the game requests (0..13)
