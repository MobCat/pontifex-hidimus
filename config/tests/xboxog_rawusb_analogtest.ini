# Phidimus original-Xbox CONSOLE-SAFE self-test — RAW-GADGET. Drives the virtual
# xboxog_rawusb XID pad from the analogtest macro: sticks and triggers move
# slowly, plus the digital shoulder bumpers press alternately (mapped to the
# Black/White buttons). NO face button, Start, Back, d-pad or stick click is
# ever touched — so no console reset/menu combo can fire.
#
# Why this exists: the full xboxog_rawusb_selftest.ini uses x360testpatten, which
# cycles Back while the triggers ramp — LT+RT+Back is a reboot combo on a real
# original Xbox, so that test resets the console mid-run. This one is safe to
# leave running on hardware indefinitely.
#
# Pi only — raw_gadget needs a UDC; off-hardware it falls back to USB/IP.
#
#   phidimus-pi config/tests/xboxog_rawusb_analogtest.ini

[config]
id       = xboxog_rawusb_analogtest
author   = MobCat
phidimus = 4.3.0
macro    = analogtest
#input   = ; Not needed for a self test — the macro IS the input.
output   = xboxog_rawusb
method   = raw_gadget       ; Pi: present on the board's USB port (carries the XID vendor requests)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port (default shown) when off-hardware

# Gentle poll cap — a real controller polls ~100 Hz; no need to hammer the bus.
[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 100

# Run every analog test function from load. They drive disjoint signals.
[defaults]
macro = analogtest.lstick(), analogtest.rstick(), analogtest.triggers(), analogtest.shoulders()

# All mappings live in .axes — even the digital bumpers, because their targets
# (BTN_WHITE / BTN_BLACK) are ANALOG on the OG Xbox. A digital source in an axes
# mapping cross-maps to a full press (0→0, pressed→255). There is deliberately NO
# [xboxog_rawusb.buttons] section: the face buttons (A/B/X/Y), Start, Back, d-pad
# and stick clicks are left at rest so no console reset/menu combo can fire.
# Y is NOT inverted here — the module's pack() already negates Y (XInput-up →
# OG-hardware-wire-up).
[xboxog_rawusb.axes]
LX = LEFT_STICK_X
LY = LEFT_STICK_Y
RX = RIGHT_STICK_X
RY = RIGHT_STICK_Y
LT = LEFT_TRIGGER
RT = RIGHT_TRIGGER
BTN_LB = BTN_WHITE     ; digital bumper → analog White (full 255 press)
BTN_RB = BTN_BLACK     ; digital bumper → analog Black (full 255 press)

# Feedback readout — surface the console's decoded rumble as OLED bars.
[xboxog_rawusb.feedback]
RUMBLE_LEFT  = RUMBLE_LEFT     ; left / low-frequency motor  (0..255)
RUMBLE_RIGHT = RUMBLE_RIGHT    ; right / high-frequency motor (0..255)
