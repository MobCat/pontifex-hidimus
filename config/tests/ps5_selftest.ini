# Phidimus DualSense self-test — drives the virtual ps5_usb pad from the SAME
# x360testpatten macro, with no physical controller. The DualSense shares the
# Xbox 360's control set (2 sticks, 4 face buttons, 2 triggers, d-pad, bumpers,
# stick-press, menu), so one macro tests both — only the binding names differ.
#
# ps5_usb is HID-class, so unlike the vendor-class xbox360_usb it works over the
# FunctionFS gadget path on the STOCK Pi kernel (no raw-gadget needed). Rung 3 of
# the output test ladder: a complex-but-compliant HID device with real Sony IDs.
#
# The macro produces Xbox-range sticks (-32768..32767); the mapper rescales them
# to the DualSense's 0..255 (rest -> ~128 centre) automatically by declared range.
# Watch it in Windows "Game Controllers" / Steam — it enumerates as a DualSense
# (054C:0CE6) and every control moves (left stick = diagonals, right = circle).
#
#   phidimus-sdk --config config\ps5_selftest.ini
#   phidimus-pi  config/ps5_selftest.ini

[config]
id       = ps5_selftest
author   = MobCat
phidimus = 4.1.0
macro    = x360testpatten
#input   = ; Not needed for a self test — the macro IS the input.
output   = ps5_usb
method   = usb_gadget      ; Pi: present on the board's USB port; elsewhere -> USB/IP

[defaults]
macro = x360testpatten.buttons(), x360testpatten.dpad(), x360testpatten.lstick(), x360testpatten.rstick(), x360testpatten.triggers()

# Xbox-layout macro signals -> DualSense buttons (standard positional convention:
# A=Cross bottom, B=Circle right, X=Square left, Y=Triangle top).
[ps5_usb.buttons]
BTN_A      = BTN_CROSS
BTN_B      = BTN_CIRCLE
BTN_X      = BTN_SQUARE
BTN_Y      = BTN_TRIANGLE
BTN_LB     = BTN_L1
BTN_RB     = BTN_R1
BTN_LS     = BTN_L3
BTN_RS     = BTN_R3
BTN_START  = BTN_OPTIONS
BTN_BACK   = BTN_CREATE
BTN_GUIDE  = BTN_PS
DPAD_UP    = BTN_DPAD_UP
DPAD_DOWN  = BTN_DPAD_DOWN
DPAD_LEFT  = BTN_DPAD_LEFT
DPAD_RIGHT = BTN_DPAD_RIGHT

[ps5_usb.axes]
LX = LEFT_STICK_X
LY = LEFT_STICK_Y
RX = RIGHT_STICK_X
RY = RIGHT_STICK_Y
LT = L2_ANALOG
RT = R2_ANALOG

# Resting output values for signals no input drives. The macro has no battery to
# report, so without this the DualSense reads 0% and Steam warns it's going flat.
# 50 is an obviously-synthetic "we set this" value (vs a real 0/100).
[ps5_usb.defaults]
BATTERY_LEVEL = 50
