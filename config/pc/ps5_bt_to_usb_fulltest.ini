# Pontifex Hidimus - Profile: PS5 DualSense full INTERNAL-output self-test
#
# Exercises every DualSense feedback channel from the controller's own inputs, with
# no game needed — the bench test for the internal output path (player LEDs,
# lightbar RGB + brightness, both rumble motors). Layers two macros on the normal
# BT -> virtual-USB DualSense passthrough:
#
#   rapidfire : BTN_MUTE arms; hold a face button to auto-fire (mic LED = status).
#   outtest   : L1 / R1     step the player-LED combo (prev / next)
#               BTN_TOUCHPAD cycle the lightbar brightness (full -> 2/3 -> 1/3)
#               TOUCH1+TOUCH2 (both fingers) set the lightbar RGB from the points
#
#   L2 / R2 -> left / right rumble, 1:1 analog (a [ps5ds.feedback] map below — pure
#   passthrough belongs in the config as data, not in a macro).
#
# Every bound input ALSO still passes through to the host ([ps5_usb.*]), so this is
# additive: L2 rumbles the pad AND sends its analog value to the host.
#
# This profile does NOT route host (game/Steam) feedback back to the pad — that is
# the separate host-output path; use config/pc/ps5_bt_to_usb.ini for that. Here the
# input-driven [ps5ds.feedback] maps own LED_R/G/B + player LEDs + rumble outright.
#
# Run: phidimus-pi config/ps5_bt_to_usb_fulltest.ini   (or phidimus-shell on PC)

[config]
id       = ps5_bt_to_usb_fulltest
author   = MobCat
phidimus = 4.1.0
input    = ps5ds
output   = ps5_usb
macro    = rapidfire, outtest
# Real USB out on the board's UDC (needs Debug > BOOT fix); falls back to USB/IP
# off-hardware. See ps5_bt_to_usb.ini.
method   = usb_gadget

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Startup defaults - applied once to the physical DualSense before the loop begins.
# (The macros overwrite LED_R/G/B and the player LEDs from frame 1; these mainly
# wake the BT pad into full-report mode and set a sane resting state.)
[defaults]
LED_R = 96
LED_G = 96
LED_B = 96

LED_P_BRIGHTNESS = 0

MIC_LED = 0
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

TOUCH1_X = 960
TOUCH1_Y = 540
TOUCH2_X = 960
TOUCH2_Y = 540

# Always-on macro calls (run every frame, before the button-bound calls): the
# rapid-fire status LED baseline and the output self-test's per-frame writer.
macro = rapidfire.led(), outtest.apply()

# Rapid fire — BTN_MUTE latches on/off; hold a face button to auto-fire it.
[rapidfire.macro]
BTN_MUTE:press = toggle()
BTN_CROSS      = fire()
BTN_CIRCLE     = fire()
BTN_SQUARE     = fire()
BTN_TRIANGLE   = fire()

# Output self-test edges — these only mutate stored state; outtest.apply() above
# turns that state into live feedback every frame.
[outtest.macro]
BTN_R1:press       = next()        ; step the player-LED combo forward
BTN_L1:press       = prev()        ; step it back
BTN_TOUCHPAD:press = brightness()  ; cycle lightbar brightness

# Button mappings - signal names are identical between ps5ds.qc and ps5_usb.qc.
# NOTE: BTN_MUTE is NOT passed through — it drives the rapid-fire latch above.
[ps5_usb.buttons]
BTN_CROSS        = BTN_CROSS
BTN_CIRCLE       = BTN_CIRCLE
BTN_SQUARE       = BTN_SQUARE
BTN_TRIANGLE     = BTN_TRIANGLE
BTN_L1           = BTN_L1
BTN_R1           = BTN_R1
BTN_L2           = BTN_L2
BTN_R2           = BTN_R2
BTN_L3           = BTN_L3
BTN_R3           = BTN_R3
BTN_CREATE       = BTN_CREATE
BTN_OPTIONS      = BTN_OPTIONS
BTN_PS           = BTN_PS
BTN_TOUCHPAD     = BTN_TOUCHPAD
BTN_DPAD_UP      = BTN_DPAD_UP
BTN_DPAD_DOWN    = BTN_DPAD_DOWN
BTN_DPAD_LEFT    = BTN_DPAD_LEFT
BTN_DPAD_RIGHT   = BTN_DPAD_RIGHT
BATTERY_CHARGING = BATTERY_CHARGING

# Axis mappings - same convention USB and BT, no inversion.
[ps5_usb.axes]
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y
L2_ANALOG     = L2_ANALOG
R2_ANALOG     = R2_ANALOG
TOUCH1_X      = TOUCH1_X
TOUCH1_Y      = TOUCH1_Y
TOUCH2_X      = TOUCH2_X
TOUCH2_Y      = TOUCH2_Y
BATTERY_LEVEL = BATTERY_LEVEL

# Internal feedback — driven entirely by controller inputs / macros (no host
# feedback routed here on purpose; see the header). Source names are bus signals
# the macros write (PLED_*, LB_*, RF_LED) or live input axes (L2/R2 analog).
[ps5ds.feedback]
# Player-LED combo from the outtest macro (L1/R1).
LED_P_OUTER  = PLED_OUTER
LED_P_INNER  = PLED_INNER
LED_P_CENTRE = PLED_CENTRE

# Lightbar RGB from the outtest macro (two-finger touch + brightness button).
LED_R = LB_R
LED_G = LB_G
LED_B = LB_B

# Rumble, 1:1 analog from the triggers: L2 -> left (heavy), R2 -> right (soft).
RUMBLE_HEAVY = L2_ANALOG
RUMBLE_SOFT  = R2_ANALOG

# Rapid-fire status -> mic LED (solid when armed, blinks while firing).
MIC_LED = RF_LED
