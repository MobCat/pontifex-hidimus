# Pontifex Hidimus - Profile: PS5 DualSense BT -> PS5 DualSense USB + rapid fire
#
# Same job as ps5_bt_to_usb.ini (present a BT DualSense as a USB DualSense for
# games that only take it over USB) but with the rapid-fire macro layered on and
# the mute-button LED INTERCEPTED for its status light. Two uses:
#
#   1. Rapid fire: press BTN_MUTE to arm (mic LED lights), then hold a face button
#      to auto-fire it; press BTN_MUTE again to disarm.
#   2. A live "is phidimus in control?" check on phidimus-shell. Other software
#      (Steam in particular) can grab the DualSense out from under the shell — you
#      see it as a rapid ps5ds disconnect/reconnect loop. If pressing BTN_MUTE
#      toggles the mic LED, phidimus owns the pad; if the LED is dead, something
#      else has taken it. (On the dongle we own the USB side, so this is a
#      shell-only concern — see notes below.)
#
# Unlike ps5_bt_to_usb.ini this is NOT a pure 1:1 map: BTN_MUTE and MIC_LED are
# repurposed for rapid fire. Use the plain config when you want a faithful pad.
#
# Run: phidimus-shell ps5_bt_to_usb_rapidfire.ini

[config]
id       = ps5_bt_to_usb_rapidfire
author   = MobCat
phidimus = 4.1.0
input    = ps5ds
output   = ps5_usb
macro    = rapidfire
# Real USB out on the board's UDC (needs Debug > BOOT fix); falls back to USB/IP
# off-hardware. See ps5_bt_to_usb.ini.
method   = usb_gadget

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Startup defaults - applied once to the physical DualSense before the loop begins.
[defaults]
LED_R = 255
LED_G = 0
LED_B = 0

LED_P_CENTRE = 1
LED_P_BRIGHTNESS = 0

MIC_LED = 0
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

TOUCH1_X = 960
TOUCH1_Y = 540
TOUCH2_X = 960
TOUCH2_Y = 540

# Hold the rapid-fire status LED at its baseline (off, or solid when armed); fire()
# overrides it to blink while shooting. Always-on, so it runs before the bindings.
macro = rapidfire.led()

# Rapid fire — BTN_MUTE latches the mode on/off; holding a face button auto-fires
# it. The face buttons still pass through below ([ps5_usb.buttons]); rapid fire
# just pulses the signal first.
[rapidfire.macro]
BTN_MUTE:press = toggle()
BTN_CROSS      = fire()
BTN_CIRCLE     = fire()
BTN_SQUARE     = fire()
BTN_TRIANGLE   = fire()

# Button mappings - signal names are identical between ps5ds.qc and ps5_usb.qc.
# NOTE: BTN_MUTE is NOT passed through here — it drives the rapid-fire latch above.
[ps5_usb.buttons]
BTN_CROSS        = BTN_CROSS
BTN_CIRCLE       = BTN_CIRCLE
BTN_SQUARE       = BTN_SQUARE
BTN_TRIANGLE     = BTN_TRIANGLE
BTN_L1           = BTN_L1
BTN_R1           = BTN_R1
BTN_L2           = BTN_L2
BTN_R2           = BTN_R2
BTN_L3           = BTN_L3
BTN_R3           = BTN_R3
BTN_CREATE       = BTN_CREATE
BTN_OPTIONS      = BTN_OPTIONS
BTN_PS           = BTN_PS
BTN_TOUCHPAD     = BTN_TOUCHPAD
BTN_DPAD_UP      = BTN_DPAD_UP
BTN_DPAD_DOWN    = BTN_DPAD_DOWN
BTN_DPAD_LEFT    = BTN_DPAD_LEFT
BTN_DPAD_RIGHT   = BTN_DPAD_RIGHT
BATTERY_CHARGING = BATTERY_CHARGING

# Axis mappings - same convention USB and BT, no inversion.
[ps5_usb.axes]
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y
L2_ANALOG     = L2_ANALOG
R2_ANALOG     = R2_ANALOG
TOUCH1_X      = TOUCH1_X
TOUCH1_Y      = TOUCH1_Y
TOUCH2_X      = TOUCH2_X
TOUCH2_Y      = TOUCH2_Y
BATTERY_LEVEL = BATTERY_LEVEL

# Feedback - the game's haptic/LED output to the virtual USB DualSense routed back
# to the physical BT DualSense. NOTE: MIC_LED is NOT routed here — the mic LED is
# intercepted below for the rapid-fire status light instead of the game's mute LED.
[ps5_usb.feedback]
RUMBLE_HEAVY     = RUMBLE_HEAVY
RUMBLE_SOFT      = RUMBLE_SOFT
LED_R            = LED_R
LED_G            = LED_G
LED_B            = LED_B
LED_P_OUTER      = LED_P_OUTER
LED_P_INNER      = LED_P_INNER
LED_P_CENTRE     = LED_P_CENTRE
LED_P_BRIGHTNESS = LED_P_BRIGHTNESS
FEATURE_FLAGS    = FEATURE_FLAGS
TRIGGER_RIGHT    = TRIGGER_RIGHT
TRIGGER_LEFT     = TRIGGER_LEFT

# Rapid-fire status LED → the physical DualSense's mute-button LED. The rapidfire
# macro drives RF_LED (solid when armed, blinking while firing); this routes it to
# the real pad so you can see the latch state in your hand. This is also the
# "phidimus in control?" indicator: if BTN_MUTE doesn't toggle this LED, another
# app has grabbed the controller.
[ps5ds.feedback]
MIC_LED = RF_LED
