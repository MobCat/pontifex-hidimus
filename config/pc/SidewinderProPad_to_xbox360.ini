# Pontifex Hidimus - Profile: SideWinder Game Pad Pro -> Xbox 360
#
# The SHIFT button is a modifier, handled here in config (not baked into the
# input module). Modifier guards on a mapping:
#   MOD+FROM   active only while MOD is held
#   !MOD+FROM  active only while MOD is NOT held
#
# The two top triggers (BTN_LT / BTN_RT) route to the analog triggers normally,
# and to the shoulder buttons while SHIFT is held — exactly what the module used
# to do internally, now data instead of code (and retunable per profile).

[config]
id     = SideWinder_to_xbox360
author = MobCat
phidimus = 4.1.0
input  = X04-63237_usb
output = xbox360_usb
usbip  = 0.0.0.0:3240

[xbox360_usb.buttons]
BTN_A = XINPUT_GAMEPAD_A
BTN_B = XINPUT_GAMEPAD_B
BTN_X = XINPUT_GAMEPAD_X
BTN_Y = XINPUT_GAMEPAD_Y
BTN_C = XINPUT_GAMEPAD_START
BTN_Z = XINPUT_GAMEPAD_BACK

# SHIFT held: the top triggers act as the shoulder buttons.
BTN_SHIFT+BTN_LT = XINPUT_GAMEPAD_LEFT_SHOULDER
BTN_SHIFT+BTN_RT = XINPUT_GAMEPAD_RIGHT_SHOULDER

[xbox360_usb.axes]
LEFT_STICK_Y = LEFT_STICK_Y, invert=true
LEFT_STICK_X = LEFT_STICK_X

# SHIFT up (normal): the top triggers drive the analog triggers (button→axis
# cross-map: pressed = full pull). Add out_max=N here to soften a full press.
!BTN_SHIFT+BTN_LT = LEFT_TRIGGER
!BTN_SHIFT+BTN_RT = RIGHT_TRIGGER
