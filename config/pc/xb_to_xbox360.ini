# Pontifex Hidimus - Profile: Original xbox -> Xbox 360

[config]
id       = xb_to_xbox360
author   = MobCat
phidimus = 4.3.0
input    = xboxog_winusb
output   = xbox360_usb

# Poll rate caps - both default to 0 (unlimited).
#
# INPUT_HZ:  caps how many input reports/sec are read from the controller.
#            0 = read as fast as the DualSense reports (~250 Hz USB, ~470 Hz BT).
#
# OUTPUT_HZ: caps how many writes/sec go to ALL virtual devices.
#            Use this if either output driver can't keep up at full input rate.
#
# Example: poll input at full speed, cap output to 100 Hz:
#   INPUT_HZ  = 0
#   OUTPUT_HZ = 100

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Startup defaults - applied once when the profile starts, before the live loop begins.
# These are sent to the DualSense via write_feedback() in the QC input module.

[defaults]
# Rumble motors - set to 0 to start silent
RUMBLE_LEFT = 0
RUMBLE_RIGHT = 0

###############################################################################################
# Xbox 360 virtual controller

[xbox360_usb.buttons]
# Face buttons are ANALOG on the original Xbox (0-255 pressure). Mapping one to a
# digital button derives the press with a threshold: it fires when the analog
# value crosses the cutoff. Default is 128; lower it (e.g. threshold=64) if an
# ageing controller feels squishy / unresponsive, raise it to avoid accidental
# presses. The same signal can ALSO be mapped as an analog axis (see below) at
# the same time — analog travel + digital press from one button, no conflict.
BTN_A = XINPUT_GAMEPAD_A
BTN_B = XINPUT_GAMEPAD_B
BTN_X = XINPUT_GAMEPAD_X
BTN_Y = XINPUT_GAMEPAD_Y, threshold=64   # example: softer trigger point for a worn button

# Shoulders (black/white buttons — also analog, same threshold rule)
BTN_WHITE = XINPUT_GAMEPAD_LEFT_SHOULDER
BTN_BLACK = XINPUT_GAMEPAD_RIGHT_SHOULDER

# Thumbstick clicks
BTN_L3 = XINPUT_GAMEPAD_LEFT_THUMB
BTN_R3 = XINPUT_GAMEPAD_RIGHT_THUMB

# Menu buttons
BTN_START = XINPUT_GAMEPAD_START
BTN_BACK  = XINPUT_GAMEPAD_BACK
#BTN_GUIDE    = XINPUT_GAMEPAD_GUIDE # Missing from og xbox

# D-pad - the QC module decodes the HAT byte into four cardinal booleans,
# so diagonals (e.g. NE) set both BTN_DPAD_UP and BTN_DPAD_RIGHT simultaneously.
BTN_DPAD_UP    = XINPUT_GAMEPAD_DPAD_UP
BTN_DPAD_DOWN  = XINPUT_GAMEPAD_DPAD_DOWN
BTN_DPAD_LEFT  = XINPUT_GAMEPAD_DPAD_LEFT
BTN_DPAD_RIGHT = XINPUT_GAMEPAD_DPAD_RIGHT

# Axis mappings.
# PS5 Y axes are inverted relative to XInput convention:
#   PS5:    0 = stick fully up
#   XInput: -32768 = stick fully up
# Setting invert=true corrects this.
#
# Optional modifiers: invert=true, deadzone=0.05, sensitivity=1.5

[xbox360_usb.axes]
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y, invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Triggers: PS5 range 0-255, XInput range 0-255, no remapping needed
LEFT_TRIGGER = LEFT_TRIGGER
RIGHT_TRIGGER = RIGHT_TRIGGER

# Feedback mappings - game rumble -> DualSense actuators.
#
# The Xbox 360 virtual device receives rumble commands from the game.
# These route those values back to the DualSense voice-coil actuators.
#
# Mapping direction is  output_signal = input_signal  (same as every other
# feedback section): the game drives the xbox360_usb signal on the left, and we
# route it to the Xbox OG actuator on the right.
#
# Output module signals (xbox360_usb, sent by the game):
#   RUMBLE_LARGE - large / low-frequency  motor (0-255)
#   RUMBLE_SMALL - small / high-frequency motor (0-255)
#
# Input module signals (xboxog_winusb write_feedback() actuators):
#   RUMBLE_LEFT  - left  actuator (low-freq / heavy)
#   RUMBLE_RIGHT - right actuator (high-freq / light)

[xbox360_usb.feedback]
RUMBLE_LARGE = RUMBLE_LEFT
RUMBLE_SMALL = RUMBLE_RIGHT
