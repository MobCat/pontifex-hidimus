# Pontifex Hidimus - Profile: PS5 DualSense BT -> PS5 DualSense USB (virtual)
#
# The physical controller connects over Bluetooth (the ps5ds input module puts it
# into full-feature mode). Phidimus presents a virtual USB DualSense over USB/IP
# so games that only accept a DualSense over USB (e.g. Returnal) work. Buttons,
# sticks, triggers, touchpad and haptics pass through.
#
# Run:    phidimus-sdk --config config/ps5_bt_to_usb.ini
# Attach: auto-attached by the usb_device driver (no manual usbip step).
#
# NOTE: the ps5_usb HID report descriptor is a placeholder pending a capture of
# the real DualSense USB descriptor — enumeration/plumbing works, but full game
# recognition may need the captured descriptor. See modules/output/ps5_usb.qc.

[config]
id       = ps5_bt_to_usb
author   = MobCat
phidimus = 4.0.0
input    = ps5ds
output   = ps5_usb
# Present the virtual DualSense on the board's own USB port (Linux UDC) so a
# console/PC sees a real USB controller. Needs the gadget/UDC up (phidimus-pi
# Debug > BOOT fix); off-hardware (e.g. the Windows SDK) it transparently falls
# back to USB/IP, so the profile stays portable.
method   = usb_gadget

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Startup defaults - applied once to the physical DualSense before the loop begins.
[defaults]
LED_R = 255
LED_G = 0
LED_B = 0

LED_P_CENTRE = 1
LED_P_BRIGHTNESS = 0

MIC_LED = 0
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

TOUCH1_X = 960
TOUCH1_Y = 540
TOUCH2_X = 960
TOUCH2_Y = 540

# Button mappings - signal names are identical between ps5ds.qc and ps5_usb.qc.
[ps5_usb.buttons]
BTN_CROSS        = BTN_CROSS
BTN_CIRCLE       = BTN_CIRCLE
BTN_SQUARE       = BTN_SQUARE
BTN_TRIANGLE     = BTN_TRIANGLE
BTN_L1           = BTN_L1
BTN_R1           = BTN_R1
BTN_L2           = BTN_L2
BTN_R2           = BTN_R2
BTN_L3           = BTN_L3
BTN_R3           = BTN_R3
BTN_CREATE       = BTN_CREATE
BTN_OPTIONS      = BTN_OPTIONS
BTN_PS           = BTN_PS
BTN_TOUCHPAD     = BTN_TOUCHPAD
BTN_MUTE         = BTN_MUTE
BTN_DPAD_UP      = BTN_DPAD_UP
BTN_DPAD_DOWN    = BTN_DPAD_DOWN
BTN_DPAD_LEFT    = BTN_DPAD_LEFT
BTN_DPAD_RIGHT   = BTN_DPAD_RIGHT
BATTERY_CHARGING = BATTERY_CHARGING

# Axis mappings - same convention USB and BT, no inversion.
[ps5_usb.axes]
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y
L2_ANALOG     = L2_ANALOG
R2_ANALOG     = R2_ANALOG
TOUCH1_X      = TOUCH1_X
TOUCH1_Y      = TOUCH1_Y
TOUCH2_X      = TOUCH2_X
TOUCH2_Y      = TOUCH2_Y
BATTERY_LEVEL = BATTERY_LEVEL

# Feedback - the game's haptic/LED output to the virtual USB DualSense (decoded
# in ps5_usb on_output) routed back to the physical BT DualSense.
[ps5_usb.feedback]
RUMBLE_HEAVY     = RUMBLE_HEAVY
RUMBLE_SOFT      = RUMBLE_SOFT
LED_R            = LED_R
LED_G            = LED_G
LED_B            = LED_B
MIC_LED          = MIC_LED
LED_P_OUTER      = LED_P_OUTER
LED_P_INNER      = LED_P_INNER
LED_P_CENTRE     = LED_P_CENTRE
LED_P_BRIGHTNESS = LED_P_BRIGHTNESS
# valid_flag0 + the adaptive-trigger blocks, raw id -> raw id (the blobs pass
# through verbatim; the flag carries the trigger-enable bits the game set).
FEATURE_FLAGS      = FEATURE_FLAGS
TRIGGER_RIGHT    = TRIGGER_RIGHT
TRIGGER_LEFT     = TRIGGER_LEFT
