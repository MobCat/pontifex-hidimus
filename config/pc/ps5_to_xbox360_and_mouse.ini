# Pontifex Hidimus - Profile: PS5 DualSense -> Xbox 360 + Mouse
#
# Works for both USB and Bluetooth ??? the ps5ds module tries USB first,
# then falls back to Bluetooth automatically.
#
# Run:   phidimus --config config/ps5_to_xbox360.ini
# Debug: phidimus --config config/ps5_to_xbox360.ini --debug 1
#
# To see all available input signals: phidimus --probe ps5ds
# To see all available output names:  phidimus --probe xbox360_usb
#                                  or phidimus --probe mouse_output

[config]
id       = ps5_to_xbox360_and_mouse
author   = MobCat
phidimus = 4.0.0
input    = ps5ds
output   = xbox360_usb, mouse_output

# Poll rate caps - both default to 0 (unlimited).
#
# INPUT_HZ:  caps how many input reports/sec are read from the controller.
#            0 = read as fast as the DualSense reports (~250 Hz USB, ~470 Hz BT).
#
# OUTPUT_HZ: caps how many writes/sec go to ALL virtual devices.
#            Use this if either output driver can't keep up at full input rate.
#
# Example: poll input at full speed, cap output to 100 Hz:
#   INPUT_HZ  = 0
#   OUTPUT_HZ = 100

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Startup defaults - applied once when the profile starts, before the live loop begins.
# These are sent to the DualSense via write_feedback() in the QC input module.

[defaults]
# Light bar colour (0 to 255) - purple is cool.
LED_R = 100
LED_G = 0
LED_B = 255

# Player indicator LEDs - the 5 dots between the touchpad and light bar.
# The firmware enforces symmetry (confirmed by raw HID byte test): outer dots
# always mirror, inner dots always mirror - individual dots cannot be addressed.
#   LED_P_OUTER  : both outer dots  (leftmost + rightmost)
#   LED_P_INNER  : both inner dots  (second from each side)
#   LED_P_CENTRE : centre dot only
# Player 1 = CENTRE, Player 2 = INNER, Player 3 = OUTER+CENTRE, Player 4 = OUTER+INNER
LED_P_OUTER  = 0
LED_P_INNER  = 0
LED_P_CENTRE = 1

# Player LED brightness - one setting shared by all lit dots: 0=high, 1=medium, 2=low
LED_P_BRIGHTNESS = 0

# Mic button LED: 0=off, 1=on, 2=pulse
MIC_LED = 0

# Rumble motors - set to 0 to start silent
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

# Set defaults for the touchpad to center it
TOUCH1_X = 960
TOUCH1_Y = 540
TOUCH2_X = 960
TOUCH2_Y = 540


###############################################################################################
# Xbox 360 virtual controller

# Button mappings - from: signal name from ps5ds
#                    to: button accepted by xbox360_usb

[xbox360_usb.buttons]
# Face buttons (PlayStation -> Xbox naming)
BTN_CROSS    = XINPUT_GAMEPAD_A
BTN_CIRCLE   = XINPUT_GAMEPAD_B
BTN_SQUARE   = XINPUT_GAMEPAD_X
BTN_TRIANGLE = XINPUT_GAMEPAD_Y

# Shoulders
BTN_L1 = XINPUT_GAMEPAD_LEFT_SHOULDER
BTN_R1 = XINPUT_GAMEPAD_RIGHT_SHOULDER

# Thumbstick clicks
BTN_L3 = XINPUT_GAMEPAD_LEFT_THUMB
BTN_R3 = XINPUT_GAMEPAD_RIGHT_THUMB

# Menu buttons
BTN_OPTIONS = XINPUT_GAMEPAD_START
BTN_CREATE  = XINPUT_GAMEPAD_BACK
BTN_PS      = XINPUT_GAMEPAD_GUIDE

# D-pad - the QC module decodes the HAT byte into four cardinal booleans,
# so diagonals (e.g. NE) set both BTN_DPAD_UP and BTN_DPAD_RIGHT simultaneously.
BTN_DPAD_UP    = XINPUT_GAMEPAD_DPAD_UP
BTN_DPAD_DOWN  = XINPUT_GAMEPAD_DPAD_DOWN
BTN_DPAD_LEFT  = XINPUT_GAMEPAD_DPAD_LEFT
BTN_DPAD_RIGHT = XINPUT_GAMEPAD_DPAD_RIGHT

# Axis mappings.
# PS5 Y axes are inverted relative to XInput convention:
#   PS5:    0 = stick fully up
#   XInput: -32768 = stick fully up
# Setting invert=true corrects this.
#
# Optional modifiers: invert=true, deadzone=0.05, sensitivity=1.5

[xbox360_usb.axes]
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y,  invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Triggers: PS5 range 0-255, XInput range 0-255, no remapping needed
L2_ANALOG = LEFT_TRIGGER
R2_ANALOG = RIGHT_TRIGGER

# Feedback mappings - game rumble -> DualSense actuators.
#
# The Xbox 360 virtual device receives rumble commands from the game.
# These route those values back to the DualSense voice-coil actuators.
#
# Output module signals (xbox360_usb feedback):
#   RUMBLE_LARGE - LargeMotor / left  actuator (low-freq,  0-255)
#   RUMBLE_SMALL - SmallMotor / right actuator (high-freq, 0-255)
#
# Input module signals (accepted by ps5ds write_feedback()):
#   RUMBLE_HEAVY - left  actuator (byte 4 of DualSense output report)
#   RUMBLE_SOFT  - right actuator (byte 3)
#
# curve=natural: 255 x (v/255)^0.75 - gentle gamma that suits the DualSense
#   voice-coil actuators; more punch at low Xbox rumble values than linear.

[xbox360_usb.feedback]
RUMBLE_LARGE = RUMBLE_HEAVY, curve=natural
RUMBLE_SMALL = RUMBLE_SOFT,  curve=natural

# ?????? Mouse output ??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
#
# The touchpad acts as a velocity-style pointer (like a trackpoint):
#   - Finger at the centre of the pad  ??? cursor stops
#   - Finger near an edge              ??? cursor moves in that direction
#   - How far from centre              ??? how fast it moves
#
# Adjust out_max to tune sensitivity (pixels per input frame at full deflection).
# Raise deadzone slightly if the cursor drifts when the finger is roughly centred.
#
# TOUCH1_X range: 0 (left) ??? 1919 (right),  centre = 960
# TOUCH1_Y range: 0 (top)  ??? 1079 (bottom), centre = 540

[mouse_output.buttons]
BTN_TOUCHPAD = MOUSE_BTN_LEFT

[mouse_output.axes]
TOUCH1_X = MOUSE_X, out_min=-15, out_max=15, deadzone=0.08
TOUCH1_Y = MOUSE_Y, out_min=-15, out_max=15, deadzone=0.08
