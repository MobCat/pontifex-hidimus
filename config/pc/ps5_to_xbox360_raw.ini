# Pontifex Hidimus - Profile: PS5 DualSense -> Xbox 360 (raw-gadget)
#
# Raw-gadget variant of ps5_to_xbox360.ini: a real DualSense (USB or Bluetooth) ->
# ps5ds input module -> rapidfire macro -> xbox360_usb presented on the Pi's own USB
# port via /dev/raw-gadget, so the host's xusb22 driver binds the virtual pad with
# its full vendor (0x21) descriptor. IDENTICAL mappings/feedback to the non-raw
# profile — only `method = raw_gadget` differs (the transport is independent of the
# button/axis/feedback maps, which reference signal names, not the transport).
#
# The ps5ds module tries USB first, then falls back to Bluetooth automatically, so on
# the Pi Zero (BT DualSense, USB port = the gadget) this binds the BT pad.
#
# Run on the dongle:  phidimus-pi config/pc/ps5_to_xbox360_raw.ini
# Off-hardware (no UDC) it falls back to USB/IP so it still runs on the desktop SDK.

[config]
id       = ps5_to_xbox360_raw
author   = MobCat
phidimus = 4.1.0
input    = ps5ds
output   = xbox360_usb
macro    = rapidfire
method   = raw_gadget        ; present on the board's USB port, carrying the 0x21 descriptor
usbip    = 127.0.0.1:3241    ; ignored on the raw path; used only for the off-hardware USB/IP fallback

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# Startup defaults - applied once when the profile starts, before the live loop begins.
# These are sent to the DualSense via write_feedback() in the QC input module.

[defaults]
# Light bar colour (0 to 255) - purple is cool.
# (Overridden each frame by the [ps5ds.feedback] battery gauge below; comment that
#  section out to use this fixed colour instead.)
LED_R = 30
LED_G = 0
LED_B = 125

# Player indicator LEDs - the 5 dots between the touchpad and light bar.
# Driven live by [xbox360_usb.feedback] below from the Xbox player-LED ring.
LED_P_OUTER  = 0
LED_P_INNER  = 0
LED_P_CENTRE = 0

# Player LED brightness - one setting shared by all lit dots: 0=high, 1=medium, 2=low
LED_P_BRIGHTNESS = 2

# Mic button LED: 0=off, 1=on, 2=pulse (driven live by [ps5ds.feedback] MIC_LED = RF_LED).
MIC_LED = 0

# Start the rapid-fire status LED maintainer (always-on). Omit for no status LED.
macro = rapidfire.led()

# Rumble motors - set to 0 to start silent
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

# Center the touchpad
TOUCH1_X = 960
TOUCH1_Y = 540
TOUCH2_X = 960
TOUCH2_Y = 540

###############################################################################################
# Rapid fire — press BTN_MUTE to arm/disarm; then holding a face button auto-fires it.

[rapidfire.macro]
BTN_MUTE:press = toggle()       # press to arm / disarm (latching)
BTN_CROSS      = fire()         # hold to auto-fire at the default rate (12 Hz)
BTN_CIRCLE     = fire()
BTN_SQUARE     = fire()
BTN_TRIANGLE   = fire()

###############################################################################################
# Xbox 360 virtual controller

[xbox360_usb.buttons]
# Face buttons (PlayStation -> Xbox naming)
BTN_CROSS    = XINPUT_GAMEPAD_A
BTN_CIRCLE   = XINPUT_GAMEPAD_B
BTN_SQUARE   = XINPUT_GAMEPAD_X
BTN_TRIANGLE = XINPUT_GAMEPAD_Y

# Shoulders
BTN_L1 = XINPUT_GAMEPAD_LEFT_SHOULDER
BTN_R1 = XINPUT_GAMEPAD_RIGHT_SHOULDER

# Thumbstick clicks
BTN_L3 = XINPUT_GAMEPAD_LEFT_THUMB
BTN_R3 = XINPUT_GAMEPAD_RIGHT_THUMB

# Menu buttons
BTN_OPTIONS = XINPUT_GAMEPAD_START
BTN_CREATE  = XINPUT_GAMEPAD_BACK
BTN_PS      = XINPUT_GAMEPAD_GUIDE

# D-pad - the QC module decodes the HAT byte into four cardinal booleans.
BTN_DPAD_UP    = XINPUT_GAMEPAD_DPAD_UP
BTN_DPAD_DOWN  = XINPUT_GAMEPAD_DPAD_DOWN
BTN_DPAD_LEFT  = XINPUT_GAMEPAD_DPAD_LEFT
BTN_DPAD_RIGHT = XINPUT_GAMEPAD_DPAD_RIGHT

# Axis mappings. PS5 Y axes are inverted relative to XInput; invert=true corrects it.
[xbox360_usb.axes]
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y,  invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Triggers: PS5 range 0-255, XInput range 0-255, no remapping needed
L2_ANALOG = LEFT_TRIGGER
R2_ANALOG = RIGHT_TRIGGER

# Feedback: game rumble (decoded by xbox360_usb on_output) -> DualSense actuators.
# scale=0.3 tames the voice-coil conversion; curve=natural adds low-end punch.
[xbox360_usb.feedback]
RUMBLE_SMALL = RUMBLE_SOFT,  scale=0.3, curve=natural
RUMBLE_LARGE = RUMBLE_HEAVY, scale=0.3, curve=natural

# Xbox LED ring -> DualSense player dots (6=P1,7=P2,8=P3,9=P4; 0=off).
LED_PATTERN = LED_P_CENTRE, map=[0:0, 6:1, 7:0, 8:1, 9:0]
LED_PATTERN = LED_P_INNER,  map=[0:0, 6:0, 7:1, 8:0, 9:1]
LED_PATTERN = LED_P_OUTER,  map=[0:0, 6:0, 7:0, 8:1, 9:1]

# ── Input-device feedback ─────────────────────────────────────────────────────
# Battery gauge on the light bar: green=full -> yellow=50% -> red=empty.
[ps5ds.feedback]
LED_R = BATTERY_LEVEL, map=[0:255, 30:200, 50:125, 100:0]
LED_G = BATTERY_LEVEL, map=[0:0,   30:50,  50:125, 100:255]
LED_B = BATTERY_LEVEL, map=[0:0,   30:0,   50:0,   100:0]

# Rapid-fire status LED → DualSense mute-button LED.
MIC_LED = RF_LED
