# Pontifex Hidimus - Profile: PS5 DualSense -> original Xbox RACING WHEEL (DRAFT)
#
# Test destination for the OG Xbox force-feedback experiment. Same DualSense input as
# ps5_to_ogxbox_rawusb.ini, but the output presents as the 3rd-party racing WHEEL
# (xboxog_racingwheel, VID 0x3767) instead of the Controller S. The question this
# profile answers on hardware:
#
#   Does presenting as the wheel make Colin McRae Rally 2005 send force feedback over
#   the interrupt-OUT endpoint (which never wedges) instead of EP0 SET_REPORT (which
#   trips the dwc2 race)?  Watch with [debug] log_transport_frames = true:
#     * "raw OUT ep handle=3 host report ..."  -> interrupt-OUT  -> the freeze is CURED
#     * "raw ep0 OUT bReq=0x09 ..."            -> still EP0       -> identity isn't the
#                                                                    lever; need the real
#                                                                    wheel's XID subtype
#
# The wheel module is a DRAFT: it presents the wheel's real USB identity but keeps the
# Controller S's XID descriptor + 20-byte report (the wheel's real XID/report format is
# unknown until one is captured with `--usb`). So it's drivable like a pad for the test.
#
#   phidimus-pi config/xbox/ps5_to_ogxbox_racingwheel.ini
#
# Signals:  phidimus-sdk --probe ps5ds   /   --probe xboxog_racingwheel

[config]
id       = ps5_to_ogxbox_racingwheel
author   = MobCat
phidimus = 4.5.0
input    = ps5ds
output   = xboxog_racingwheel
method   = raw_gadget       ; Pi: present on the board's USB port (carries the XID vendor requests)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port when off-hardware

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# ── Startup defaults ─────────────────────────────────────────────────────────
[defaults]
# DualSense light bar — orange, to tell this profile apart from the Controller S one.
LED_R = 200
LED_G = 60
LED_B = 0

LED_P_OUTER  = 0
LED_P_INNER  = 0
LED_P_CENTRE = 0
LED_P_BRIGHTNESS = 2
MIC_LED = 0

# Force/rumble silent at start.
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

###############################################################################################
# original Xbox virtual wheel (XID) — driven like a pad for the test (draft report format)

[xboxog_racingwheel.buttons]
BTN_L3 = BTN_L3
BTN_R3 = BTN_R3
BTN_OPTIONS = BTN_START
BTN_CREATE  = BTN_BACK
BTN_DPAD_UP    = BTN_DPAD_UP
BTN_DPAD_DOWN  = BTN_DPAD_DOWN
BTN_DPAD_LEFT  = BTN_DPAD_LEFT
BTN_DPAD_RIGHT = BTN_DPAD_RIGHT

[xboxog_racingwheel.axes]
# Left stick steers; both sticks passed through. invert on Y so PS5-up reads as up.
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y,  invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Face buttons — full-press digital onto the OG Xbox's analog buttons (no analogface
# macro on this draft; kept simple for the FFB routing test).
BTN_CROSS    = BTN_A
BTN_CIRCLE   = BTN_B
BTN_SQUARE   = BTN_X
BTN_TRIANGLE = BTN_Y

# Triggers = throttle / brake.
L2_ANALOG = LEFT_TRIGGER
R2_ANALOG = RIGHT_TRIGGER

# Shoulders → analog White / Black (full press = 255).
BTN_L1 = BTN_WHITE
BTN_R1 = BTN_BLACK

###############################################################################################
# Force feedback  (console -> DualSense)  — the "fake FFB" destination
#
# The wheel module publishes the console's force as WHEELFEEDBACK (a 0-255 scalar,
# mono on EP0 as `00 06 V V V V`, or the left force on interrupt-OUT).
#
# ADAPTIVE TRIGGERS as the FFB feel: route WHEELFEEDBACK onto both trigger STRENGTH
# signals. ps5ds.qc turns each strength into a uniform-resistance trigger effect, so the
# harder the console pushes force, the stiffer the DualSense triggers get. This is now
# a plain scalar map — the byte-level effect blob lives in ps5ds.qc, exposed as a simple
# strength signal (engine 4.5.0 map+curve: the stops are ANCHORS, curve shapes between).
#
#   map=[0:0, 30:0, 255:255]  a small deadzone (no resistance under 30), then ramp
#   curve=natural             gentle gamma so light force is felt without being harsh
[xboxog_racingwheel.feedback]
WHEELFEEDBACK = TRIGGER_R_STRENGTH, map=[0:0, 30:0, 255:255], curve=natural
WHEELFEEDBACK = TRIGGER_L_STRENGTH, map=[0:0, 30:0, 255:255], curve=natural

# Keep a light rumble too, so there's vibration feedback alongside the trigger tension.
WHEELFEEDBACK = RUMBLE_HEAVY, scale=0.35, curve=natural
WHEELFEEDBACK = RUMBLE_SOFT,  scale=0.35, curve=natural

# ── DualSense's own lights ────────────────────────────────────────────────────
[ps5ds.feedback]
# Battery gauge on the light bar (overrides the orange default live).
LED_R = BATTERY_LEVEL, map=[0:255, 30:200, 50:200, 100:0]
LED_G = BATTERY_LEVEL, map=[0:0,   30:60,  50:60,  100:255]
LED_B = BATTERY_LEVEL, map=[0:0,   30:0,   50:0,   100:0]
