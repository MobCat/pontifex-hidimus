# Pontifex Hidimus - Profile: PS4 DualShock 4 -> original Xbox "Duke" (XID/raw-gadget)
#
# Presents as a genuine Duke (the big launch controller, PID 0202) rather than the
# Controller S — some OG Xbox games read the pad's PID/XID subtype to tell which
# controller is plugged in. The output module xboxog_duke imports xboxog_rawusb
# (the S) and overrides only the five bytes that differ; see modules/output/.
#
# Straightforward mapping, no analogface macro yet: the DS4 has no mute button for
# the latch and no mic LED for the indicator. When we want feathered analog face
# buttons here, latch analogface on BTN_TOUCHPAD and route AF_LED to the lightbar.
#
# NOTE: modules/input/ps4ds.qc is still a DRAFT (v0.1.0, decoded from docs, not yet
# capture-confirmed) — this is the "plug in and see" test. If a control is off,
# --probe ps4ds against a real DS4 and fix the module's parse().
#
#   phidimus-pi config/xbox/ps4_to_ogxbox_duke.ini
#
# Signals:  phidimus-sdk --probe ps4ds   /   --probe xboxog_duke

[config]
id       = ps4_to_ogxbox_duke
author   = MobCat
phidimus = 4.3.0
input    = ps4ds
output   = xboxog_duke
method   = raw_gadget       ; Pi: present on the board's USB port (carries the XID vendor requests)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port when off-hardware (Windows has no XID driver)

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# ── Startup defaults ─────────────────────────────────────────────────────────
[defaults]
# DS4 lightbar (battery gauge below overrides it live).
LED_R = 30
LED_G = 0
LED_B = 125

# Rumble silent at start.
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

###############################################################################################
# original Xbox virtual controller (Duke / XID)

# Digital buttons (report byte 2). Face buttons are analog on the OG Xbox, so they
# live in [.axes] below (a digital press cross-maps to a full 255).
[xboxog_duke.buttons]
BTN_L3      = BTN_L3
BTN_R3      = BTN_R3
BTN_OPTIONS = BTN_START
BTN_SHARE   = BTN_BACK

BTN_DPAD_UP    = BTN_DPAD_UP
BTN_DPAD_DOWN  = BTN_DPAD_DOWN
BTN_DPAD_LEFT  = BTN_DPAD_LEFT
BTN_DPAD_RIGHT = BTN_DPAD_RIGHT

# Analog controls.
[xboxog_duke.axes]
# Sticks. DS4 Y is 0=up (same as the DualSense); invert=true makes up read as up
# on the console. The output module writes sticks verbatim, so invert here is the
# single direction knob (flip it if your console shows Y inverted).
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y,  invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Face buttons → the OG Xbox's ANALOG face buttons (digital press = full 255).
BTN_CROSS    = BTN_A
BTN_CIRCLE   = BTN_B
BTN_SQUARE   = BTN_X
BTN_TRIANGLE = BTN_Y

# Triggers.
L2_ANALOG = LEFT_TRIGGER
R2_ANALOG = RIGHT_TRIGGER

# Shoulders → the OG Xbox's analog White/Black (digital press = full 255).
BTN_L1 = BTN_WHITE
BTN_R1 = BTN_BLACK

###############################################################################################
# Feedback

# Console rumble → DS4 actuators.
#   xboxog_duke out_feedback: RUMBLE_LEFT (heavy/low), RUMBLE_RIGHT (light/high)
#   ps4ds actuators:          RUMBLE_HEAVY (left),     RUMBLE_SOFT (right)
[xboxog_duke.feedback]
RUMBLE_LEFT  = RUMBLE_HEAVY, scale=0.3, curve=natural
RUMBLE_RIGHT = RUMBLE_SOFT,  scale=0.3, curve=natural

# ── DS4's own lightbar ────────────────────────────────────────────────────────
# Battery gauge: green=full → yellow=50% → red=empty.
[ps4ds.feedback]
LED_R = BATTERY_LEVEL, map=[0:255, 30:200, 50:125, 100:0]
LED_G = BATTERY_LEVEL, map=[0:0,   30:50,  50:125, 100:255]
LED_B = BATTERY_LEVEL, map=[0:0,   30:0,   50:0,   100:0]
