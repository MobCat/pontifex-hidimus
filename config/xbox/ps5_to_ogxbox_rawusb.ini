# Pontifex Hidimus - Profile: PS5 DualSense -> original Xbox (XID over raw-gadget)
#
# The real-console sibling of ps5_to_xbox360.ini: same DualSense input, but the
# output is a genuine original-Xbox controller presented on the Pi's own USB port
# (method=raw_gadget), so it drives a REAL Xbox. Works over USB or Bluetooth (the
# ps5ds module tries USB first, then falls back to BT).
#
# One extra over the plain boilerplate: the analogface macro — the DualSense has
# digital face buttons; the OG Xbox has ANALOG ones. Arm it with the mute button,
# then hold a face button and use the right trigger to feather that button's
# pressure. See macros/analogface.qc.
#
#   phidimus-pi config/xbox/ps5_to_ogxbox_rawusb.ini
#
# Signals:  phidimus-sdk --probe ps5ds   /   --probe xboxog_rawusb

[config]
id       = ps5_to_ogxbox_rawusb
author   = MobCat
phidimus = 4.3.0
input    = ps5ds
output   = xboxog_rawusb
macro    = analogface
method   = raw_gadget       ; Pi: present on the board's USB port (carries the XID vendor requests)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port when off-hardware (Windows has no XID driver)

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# ── Startup defaults ─────────────────────────────────────────────────────────
[defaults]
# DualSense light bar (battery gauge below overrides it live).
LED_R = 30
LED_G = 0
LED_B = 125

# Player dots off — the OG Xbox has no player-LED ring to drive them from.
LED_P_OUTER  = 0
LED_P_INNER  = 0
LED_P_CENTRE = 0
LED_P_BRIGHTNESS = 2

# Mic LED off at start; the analogface macro drives it live ([ps5ds.feedback] below).
MIC_LED = 0

# Run the analog-face macro every tick.
macro = analogface.update()

# Rumble silent at start.
RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

# ── analogface latch ─────────────────────────────────────────────────────────
# Press the mute button to arm/disarm. Armed: hold a face button + pull the right
# trigger to set that button's analog pressure (mic LED on, pulses while dialing).
# Disarmed: face buttons are normal full-press digital (mic LED off).
[analogface.macro]
BTN_MUTE:press = toggle()

###############################################################################################
# original Xbox virtual controller (XID)

# Digital buttons (report byte 2). Face buttons are NOT here — they are analog on
# the OG Xbox and driven by the analogface macro's AF_* signals in [.axes] below.
[xboxog_rawusb.buttons]
# Thumbstick clicks
BTN_L3 = BTN_L3
BTN_R3 = BTN_R3

# Menu buttons
BTN_OPTIONS = BTN_START
BTN_CREATE  = BTN_BACK

# D-pad
BTN_DPAD_UP    = BTN_DPAD_UP
BTN_DPAD_DOWN  = BTN_DPAD_DOWN
BTN_DPAD_LEFT  = BTN_DPAD_LEFT
BTN_DPAD_RIGHT = BTN_DPAD_RIGHT

# Analog controls.
[xboxog_rawusb.axes]
# Sticks. invert=true on Y makes PS5-up read as up on the console. The output
# module writes sticks verbatim (no hidden negate), so Y direction is owned here:
# if your console shows the sticks inverted top-to-bottom, flip invert on the two
# Y lines (this is the ONE knob for it).
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y,  invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Analog face buttons — driven by the analogface macro (NOT the raw face buttons).
AF_A = BTN_A
AF_B = BTN_B
AF_X = BTN_X
AF_Y = BTN_Y

# Triggers. Right trigger comes from the analogface macro's GATED value (AF_RT):
# the raw trigger normally, or 0 while it is dialing a face button's pressure.
L2_ANALOG = LEFT_TRIGGER
AF_RT     = RIGHT_TRIGGER

# Shoulders → the OG Xbox's analog White/Black (digital press = full 255).
BTN_L1 = BTN_WHITE
BTN_R1 = BTN_BLACK

###############################################################################################
# Feedback

# Console rumble → DualSense actuators (same taming as the 360 profile).
#   xboxog_rawusb out_feedback: RUMBLE_LEFT (heavy/low), RUMBLE_RIGHT (light/high)
#   ps5ds actuators:              RUMBLE_HEAVY (left),     RUMBLE_SOFT (right)
[xboxog_rawusb.feedback]
RUMBLE_LEFT  = RUMBLE_HEAVY, scale=0.3, curve=natural
RUMBLE_RIGHT = RUMBLE_SOFT,  scale=0.3, curve=natural

# ── DualSense's own lights ────────────────────────────────────────────────────
# Battery gauge on the light bar: green=full → yellow=50% → red=empty.
[ps5ds.feedback]
LED_R = BATTERY_LEVEL, map=[0:255, 30:200, 50:125, 100:0]
LED_G = BATTERY_LEVEL, map=[0:0,   30:50,  50:125, 100:255]
LED_B = BATTERY_LEVEL, map=[0:0,   30:0,   50:0,   100:0]

# analogface status → DualSense mute LED (0 off / 1 on / 2 pulse). Direct pass —
# AF_LED already uses the MIC_LED value range.
MIC_LED = AF_LED
