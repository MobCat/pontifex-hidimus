# Pontifex Hidimus - Profile: PS5 DualSense -> original Xbox "Duke" (XID over raw-gadget)
#
# A/B twin of ps5_to_ogxbox_rawusb.ini: IDENTICAL DualSense input and mappings, but the
# output presents as the big launch "Duke" pad (xboxog_duke, 045E:0202) instead of the
# Controller S (045E:0289). Same signal names (the Duke module imports the Controller S),
# so this is a clean identity-only A/B — use it to see whether Colin McRae Rally 2005
# behaves differently (EP0-FFB wedge or not) against the Duke's PID/XID subtype.
#
#   phidimus-pi config/xbox/ps5_to_ogxbox_duke.ini
#
# Signals:  phidimus-sdk --probe ps5ds   /   --probe xboxog_duke

[config]
id       = ps5_to_ogxbox_duke
author   = MobCat
phidimus = 4.3.0
input    = ps5ds
output   = xboxog_duke
macro    = analogface
method   = raw_gadget       ; Pi: present on the board's USB port (carries the XID vendor requests)
# usbip  = 127.0.0.1:3240   ; optional USB/IP host:port when off-hardware

[maxPollHZ]
INPUT_HZ  = 0
OUTPUT_HZ = 0

# ── Startup defaults ─────────────────────────────────────────────────────────
[defaults]
# DualSense light bar — purple, to tell the Duke profile apart from the Controller S one.
LED_R = 90
LED_G = 0
LED_B = 160

LED_P_OUTER  = 0
LED_P_INNER  = 0
LED_P_CENTRE = 0
LED_P_BRIGHTNESS = 2
MIC_LED = 0

# Run the analog-face macro every tick.
macro = analogface.update()

RUMBLE_HEAVY = 0
RUMBLE_SOFT  = 0

# ── analogface latch ─────────────────────────────────────────────────────────
# Press mute to arm/disarm. Armed: hold a face button + pull the right trigger to set
# that button's analog pressure.
[analogface.macro]
BTN_MUTE:press = toggle()

###############################################################################################
# original Xbox virtual controller — The Duke (XID)

[xboxog_duke.buttons]
BTN_L3 = BTN_L3
BTN_R3 = BTN_R3
BTN_OPTIONS = BTN_START
BTN_CREATE  = BTN_BACK
BTN_DPAD_UP    = BTN_DPAD_UP
BTN_DPAD_DOWN  = BTN_DPAD_DOWN
BTN_DPAD_LEFT  = BTN_DPAD_LEFT
BTN_DPAD_RIGHT = BTN_DPAD_RIGHT

[xboxog_duke.axes]
# Sticks. invert=true on Y makes PS5-up read as up on the console (the ONE knob for it).
LEFT_STICK_X  = LEFT_STICK_X
LEFT_STICK_Y  = LEFT_STICK_Y,  invert=true
RIGHT_STICK_X = RIGHT_STICK_X
RIGHT_STICK_Y = RIGHT_STICK_Y, invert=true

# Analog face buttons — driven by the analogface macro (NOT the raw face buttons).
AF_A = BTN_A
AF_B = BTN_B
AF_X = BTN_X
AF_Y = BTN_Y

# Triggers. Right trigger comes from the analogface macro's gated value (AF_RT).
L2_ANALOG = LEFT_TRIGGER
AF_RT     = RIGHT_TRIGGER

# Shoulders → the OG Xbox's analog White/Black (digital press = full 255).
BTN_L1 = BTN_WHITE
BTN_R1 = BTN_BLACK

###############################################################################################
# Feedback

# Console rumble → DualSense actuators.
[xboxog_duke.feedback]
RUMBLE_LEFT  = RUMBLE_HEAVY, scale=0.3, curve=natural
RUMBLE_RIGHT = RUMBLE_SOFT,  scale=0.3, curve=natural

# ── DualSense's own lights ────────────────────────────────────────────────────
[ps5ds.feedback]
# Battery gauge on the light bar: green=full → yellow=50% → red=empty.
LED_R = BATTERY_LEVEL, map=[0:255, 30:200, 50:125, 100:0]
LED_G = BATTERY_LEVEL, map=[0:0,   30:50,  50:125, 100:255]
LED_B = BATTERY_LEVEL, map=[0:0,   30:0,   50:0,   100:0]

# analogface status → DualSense mute LED (0 off / 1 on / 2 pulse).
MIC_LED = AF_LED
